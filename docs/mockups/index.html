<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Pilots — mockup gallery</title>
<style>
:root{
  --primary:#2F6B5C; --on-primary:#fff;
  --primary-container:#D3E8E0; --on-primary-container:#082019;
  --surface:#FAFBFA; --surface-1:#F3F6F4; --surface-2:#EDF1EF; --surface-3:#E6ECE8;
  --on-surface:#171D1B; --on-surface-variant:#404944; --outline-variant:#C7D0CB;
  --font:"Roboto Flex","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --ease:260ms cubic-bezier(.16,1,.3,1);
}
body.dark{
  --primary:#9FD3C3; --on-primary:#00382C;
  --primary-container:#26564A; --on-primary-container:#BBF0DF;
  --surface:#121816; --surface-1:#191F1D; --surface-2:#1E2523; --surface-3:#252C29;
  --on-surface:#E1E4E1; --on-surface-variant:#BFC9C4; --outline-variant:#404944;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.5 var(--font);background:var(--surface-1);color:var(--on-surface);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{border:0;background:none;cursor:pointer;font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}

header{flex:none;padding:16px 22px 0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:var(--on-primary);
  display:grid;place-items:center;font-size:14px}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--on-surface-variant)}
.top .push{margin-left:auto;display:flex;gap:8px;align-items:center}
.mini{height:34px;padding:0 14px;border-radius:99px;font-size:12px;font-weight:600;
  color:var(--on-surface-variant);transition:background var(--ease),border-radius var(--ease)}
.mini:hover{background:var(--surface-2);color:var(--on-surface)}
.mini:active{border-radius:8px}

.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px}
.tab{
  flex:none;min-width:210px;text-align:left;padding:12px 16px;border-radius:16px;
  background:var(--surface-2);color:var(--on-surface-variant);
  transition:background var(--ease),color var(--ease),border-radius var(--ease);
}
.tab:hover{background:var(--surface-3)}
.tab:active{border-radius:8px}
.tab.on{background:var(--primary-container);color:var(--on-primary-container)}
.tab b{display:block;font-size:15px;font-weight:600}
.tab span{display:block;font-size:12px;opacity:.85;margin-top:2px}
.tab .kbd{float:right;font-size:12px;opacity:.6;font-weight:600}

.stage{flex:1;min-height:0;padding:0 22px 22px}
.frame{width:100%;height:100%;border:0;border-radius:20px;background:var(--surface);
  box-shadow:0 8px 24px rgba(23,29,27,.10), 0 0 0 1px rgba(23,29,27,.05);display:block}
body.dark .frame{box-shadow:0 8px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05)}
.note{font-size:12px;color:var(--on-surface-variant);padding:0 22px 10px}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="mark">&#9992;</div>
    <div>
      <h1>Email Pilots — mockup gallery</h1>
      <div class="sub">Six directions for the same app. Every control inside is live.</div>
    </div>
    <div class="push">
      <button class="mini" id="newTab">Open this one in a new tab</button>
      <button class="mini" id="themeBtn">Dark</button>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-src="original-fluent2.html">
      <span class="kbd">1</span>
      <b>Your app &middot; Fluent 2</b>
      <span>WinUI 3 done properly. Mica, 32px controls, Settings cards, Segoe Fluent Icons.</span>
    </button>
    <button class="tab" data-src="original-m3.html">
      <span class="kbd">2</span>
      <b>Your app &middot; M3 Expressive</b>
      <span>Same views in Material 3. Reads Android on a desktop.</span>
    </button>
    <button class="tab" data-src="windows-app-m3.html">
      <span class="kbd">3</span>
      <b>Balanced redesign</b>
      <span>Calm teal, reorganised nav, paywall and payoff built in.</span>
    </button>
    <button class="tab" data-src="windows-app.html">
      <span class="kbd">4</span>
      <b>Institutional</b>
      <span>Dense, restrained, hairline rules. Reads enterprise.</span>
    </button>
    <button class="tab" data-src="windows-app-casual.html">
      <span class="kbd">5</span>
      <b>Casual</b>
      <span>Loud and playful. Confetti, streaks, emoji.</span>
    </button>
    <button class="tab" data-src="m3-expressive.html">
      <span class="kbd">6</span>
      <b>Component study</b>
      <span>Six phone screens, a desktop board, and the token sheet.</span>
    </button>
  </nav>
</header>

<div class="stage"><iframe class="frame" id="frame" src="original-fluent2.html" title="Mockup preview"></iframe></div>
<div class="note" id="note"></div>

<script>
const $ = s => document.querySelector(s);
const tabs = [...document.querySelectorAll('.tab')];
const frame = $('#frame');

function show(tab){
  tabs.forEach(t => t.classList.toggle('on', t === tab));
  frame.src = tab.dataset.src;
  $('#note').textContent = tab.dataset.src;
}
tabs.forEach(t => t.addEventListener('click', () => show(t)));
show(tabs[0]);

/* 1-6 switch directions, but only when the gallery itself has focus */
document.addEventListener('keydown', e => {
  const i = " 123456".indexOf(e.key);
  if (i > 0 && tabs[i - 1] && document.activeElement !== frame) show(tabs[i - 1]);
});

$('#newTab').addEventListener('click', () => window.open(frame.src, '_blank'));
$('#themeBtn').addEventListener('click', () => {
  const dark = document.body.classList.toggle('dark');
  $('#themeBtn').textContent = dark ? 'Light' : 'Dark';
});
</script>
</body>
</html>
