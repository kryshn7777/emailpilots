<!doctype html>
<!--
  ink-trace.html — DEV TOOL ONLY. Never shipped, never linked from the site, never referenced
  from src/ (the island-boundary budget gate would catch a reference, but say it out loud).
  Open it straight off disk: no build step, no dependency, no network.

  It records pointer strokes and exports exactly the JSON pipeline/bake-ink.mjs consumes:
    { brushRadius, strokes: [{ region: 'body'|'token'|'name', points: [[x,y], …] }] }
  with points normalised to 0..1 in texture space.

  Stroke ORDER is the reveal order (REVIEWS.md B-4) — draw `Hi ` first, then `{{ name }},`,
  then the continuation. Only `Hi`, `{{ name }},` and `Maya,` may be legible: any other legible
  word would be an uncited product claim rendered in the world (EXP-04 / COPY-PLAN truth rule).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ink-trace — Ch1 handwriting authoring (dev tool)</title>
    <style>
      body { margin: 0; padding: 16px; background: #14161d; color: #e6e2d8;
             font: 13px/1.5 ui-monospace, "IBM Plex Mono", monospace; }
      canvas { background: #eee7d6; border-radius: 4px; touch-action: none; cursor: crosshair;
               width: 1024px; height: 512px; display: block; }
      .bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 0 0 10px; }
      label { display: inline-flex; gap: 5px; align-items: center; }
      button, input { font: inherit; background: #262a35; color: inherit; border: 1px solid #3a4050;
                      border-radius: 3px; padding: 4px 9px; }
      button:hover { background: #333947; }
      .note { opacity: 0.62; margin-top: 10px; max-width: 1024px; }
      b { color: #ffd479; }
    </style>
  </head>
  <body>
    <div class="bar">
      <label><input type="radio" name="region" value="body" checked /> body</label>
      <label><input type="radio" name="region" value="token" /> token — <code>{{ name }},</code></label>
      <label><input type="radio" name="region" value="name" /> name — <code>Maya,</code></label>
      <label>brush <input id="brush" type="number" value="3" min="0.5" step="0.5" style="width: 62px" /></label>
      <button id="undo">undo stroke</button>
      <button id="clear">clear</button>
      <button id="export">export strokes.json</button>
      <span id="stat"></span>
    </div>
    <canvas id="c" width="1024" height="512"></canvas>
    <p class="note">
      Order matters: the bake turns stroke order into a global arc-length ramp, so
      <b>draw `Hi ` (body) → `{{ name }},` (token) → `Maya,` (name, over the token's footprint)
      → the continuation (body)</b>. Save next to the repo as
      <code>assets-source/ink/strokes.json</code>, then
      <code>node pipeline/bake-ink.mjs</code>.
    </p>
    <script>
      const COLOUR = { body: '#1c2234', token: '#1d4ed8', name: '#b91c1c' };
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const strokes = [];
      let live = null;

      const region = () => document.querySelector('input[name=region]:checked').value;
      const brush = () => Number(document.getElementById('brush').value) || 3;

      function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineCap = ctx.lineJoin = 'round';
        for (const s of strokes.concat(live ? [live] : [])) {
          ctx.strokeStyle = COLOUR[s.region];
          ctx.lineWidth = brush() * 2;
          ctx.beginPath();
          s.points.forEach(([x, y], i) => {
            const px = x * canvas.width;
            const py = y * canvas.height;
            i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
          });
          ctx.stroke();
        }
        const n = (r) => strokes.filter((s) => s.region === r).length;
        document.getElementById('stat').textContent =
          `${strokes.length} strokes — body ${n('body')} / token ${n('token')} / name ${n('name')}`;
      }

      /** Canvas-relative, normalised, resampled at ~2 device px so the JSON stays small. */
      function point(ev) {
        const r = canvas.getBoundingClientRect();
        return [(ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height];
      }

      canvas.addEventListener('pointerdown', (ev) => {
        canvas.setPointerCapture(ev.pointerId);
        live = { region: region(), points: [point(ev)] };
        redraw();
      });
      canvas.addEventListener('pointermove', (ev) => {
        if (!live) return;
        const p = point(ev);
        const last = live.points[live.points.length - 1];
        const dx = (p[0] - last[0]) * canvas.width;
        const dy = (p[1] - last[1]) * canvas.height;
        if (dx * dx + dy * dy < 4) return;
        live.points.push(p);
        redraw();
      });
      const end = () => {
        if (live && live.points.length >= 2) strokes.push(live);
        live = null;
        redraw();
      };
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);

      document.getElementById('undo').onclick = () => { strokes.pop(); redraw(); };
      document.getElementById('clear').onclick = () => { strokes.length = 0; redraw(); };
      document.getElementById('export').onclick = () => {
        const round = (v) => Math.round(v * 100000) / 100000;
        const doc = {
          brushRadius: brush(),
          strokes: strokes.map((s) => ({ region: s.region, points: s.points.map((p) => p.map(round)) })),
        };
        const url = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 1) + '\n'], { type: 'application/json' }));
        Object.assign(document.createElement('a'), { href: url, download: 'strokes.json' }).click();
        URL.revokeObjectURL(url);
      };
      redraw();
    </script>
  </body>
</html>
