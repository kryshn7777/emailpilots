name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The unit tests are pure Node (vitest) — no Electron runtime needed, so skip
    # the heavy Electron binary download to keep CI fast.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vite/esbuild transpile without type-checking, so this is the only gate
      # that catches a type error before it ships.
      - run: npm run typecheck
      - run: npm test
