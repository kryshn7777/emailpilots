name: Deploy site (landing + Overnight Flight)

# MANUAL ONLY, on purpose.
#
# A repository has exactly one Pages site, so this workflow publishes BOTH
# sites in one artifact rather than fighting deploy-landing.yml over it:
#
#   /            landing/          (the existing marketing site)
#   /flight/     New Website/      (The Overnight Flight)
#
# It stays on workflow_dispatch so nothing goes live by accident, and shares
# the `pages` concurrency group with deploy-landing.yml so the two can never
# race each other onto the same site.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build and publish
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # project site lives at /<repo>/ — derived, never hardcoded, so renaming
      # the repository does not silently break every asset path
      ROOT_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---- landing → site root ----
      - name: Install landing
        working-directory: landing
        run: npm ci
      - name: Build landing
        working-directory: landing
        run: npm run build
        env:
          PAGES_BASE: ${{ env.ROOT_BASE }}

      # ---- flight → /flight/ ----
      # --legacy-peer-deps is required, not cosmetic. vite-plugin-glsl declares
      # a peerOptional on @rollup/pluginutils@^5 while @swup/parallel-plugin
      # pulls v3 in through microbundle, which plain npm cannot resolve. The
      # lock file is generated the same way, so CI has to install it the same
      # way. (landing above resolves cleanly and stays on plain `npm ci`.)
      - name: Install flight
        working-directory: New Website
        run: npm ci --legacy-peer-deps
      # The HDRI is fetched, not committed (scripts/fetch-hdri.mjs). The engine
      # falls back to RoomEnvironment when it is missing, so a fetch failure
      # should degrade the lighting, not fail the deploy.
      - name: Fetch flight assets
        working-directory: New Website
        run: npm run setup:assets
        continue-on-error: true
      - name: Build flight
        working-directory: New Website
        run: npm run build
        env:
          PAGES_BASE: ${{ env.ROOT_BASE }}flight/
          PAGES_SITE: https://${{ github.repository_owner }}.github.io

      - name: Assemble one artifact
        run: |
          mkdir -p _site
          cp -r landing/dist/. _site/
          mkdir -p "_site/flight"
          cp -r "New Website/dist/." "_site/flight/"
          # Pages runs Jekyll over the artifact unless told not to, and Jekyll
          # drops every directory whose name starts with an underscore —
          # which is exactly where Astro puts its bundles (_astro/).
          touch _site/.nojekyll
          echo "--- published tree (top level) ---"
          ls -la _site
          ls -la _site/flight

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
